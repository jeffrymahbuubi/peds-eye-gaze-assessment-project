# Grid click task (Compass-style comparison). Targets light up one at a time.
task_id: click_grid
title: "網格點擊 / Grid Click"
instruction: "亮起來的格子，用眼睛選到它。"

grid:
  rows: 3
  cols: 3
  margin_frac: 0.12          # margin around the grid, fraction of screen
  # Space between neighbouring cells: standard (today's board) | wide 1 deg |
  # extra_wide 2 deg, converted to px like the target size (SPEC-grid-cell-gap.md).
  # Wide gaps are a dead zone: a look between two cells selects neither.
  gap: standard

trials: 18                    # <= rows*cols*repeats; order is randomized
timeout_ms: 8000
inter_trial_interval_ms: 800

target:
  # Target size as a preset by visual angle (diameter): small 3 deg | medium
  # 5 deg | large 8 deg, converted to px for the monitor and the 650 mm viewing
  # distance (SPEC-target-size-and-motion-paths.md). If the preset does not fit
  # its grid cell, the target AND its hitbox are shrunk to fit.
  # Legacy: an explicit `radius_px: <px>` (e.g. 100) is still read when `size`
  # is absent (older configs/profiles); when both are present `size` wins.
  size: medium

feedback:
  hit_sound: true
  miss_sound: true
  particles: true

theme: forest
