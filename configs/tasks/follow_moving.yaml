# Follow-and-click task. Target moves along a path; select it inside a zone.
task_id: follow_moving
title: "追視點擊 / Follow & Click"
instruction: "跟著移動的目標，在它變亮時選到它。"

trials: 6
timeout_ms: 12000
inter_trial_interval_ms: 1000

motion:
  # circular | horizontal | vertical | diagonal_tlbr (top-left corner to
  # bottom-right, bouncing) | diagonal_trbl (top-right corner to bottom-left,
  # bouncing). Every straight path moves at the same on-screen speed
  # (speed_frac_per_s x canvas width, in px/s).
  path: circular
  speed_frac_per_s: 0.20      # fraction of screen width per second
  select_window_ms: 2500      # window during which selection counts as hit

target:
  # Target size as a preset by visual angle (diameter): small 3 deg | medium
  # 5 deg | large 8 deg, converted to px for the monitor and the 650 mm viewing
  # distance (SPEC-target-size-and-motion-paths.md). The size never changes; a
  # path end that would put the target past the canvas edge is moved inward.
  # Legacy: an explicit `radius_px: <px>` (e.g. 100) is still read when `size`
  # is absent (older configs/profiles); when both are present `size` wins.
  size: medium

feedback:
  hit_sound: true
  miss_sound: true
  particles: true

theme: forest
