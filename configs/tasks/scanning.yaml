# Scanning selection task. Several icons; the target icon lights up.
task_id: scanning
title: "掃描選擇 / Scanning Selection"
instruction: "在多個圖案中，選到亮起來的那一個。"

trials: 6
timeout_ms: 10000
inter_trial_interval_ms: 900

layout:
  n_icons: 4                  # number of distractor icons + target
  # Icon size as a preset by visual angle: the VISIBLE icon's diameter
  # (small 3 deg | medium 5 deg | large 8 deg), converted to px for the monitor
  # and the 650 mm viewing distance (SPEC-target-size-and-motion-paths.md). If
  # the icons would overlap each other or leave the canvas, all of them are
  # shrunk together to fit. Legacy: an explicit `radius_px: <px>` (the hit
  # radius; the icon is drawn at 78 % of it) is still read when `size` is
  # absent (older configs/profiles); when both are present `size` wins.
  size: medium
  arrangement: grid          # row | ring | grid -- grid is real 2D visual search
  margin_frac: 0.14          # inset from screen edge, as a fraction of screen size

feedback:
  hit_sound: true
  miss_sound: true
  particles: true

theme: forest
